name: Send Discord notifications daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Load MODEL_NAME from .env
        run: |
          set -a
          source .env
          set +a
          if [ -z "$MODEL_NAME" ]; then
            echo "MODEL_NAME is missing in .env"
            exit 1
          fi
          echo "OLLAMA_MODEL=$MODEL_NAME" >> "$GITHUB_ENV"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ runner.os }}-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama server
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull Ollama model
        run: ollama pull "${{ env.OLLAMA_MODEL }}"

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY }}
          ARXIV_QUERY: ${{ vars.ARXIV_QUERY }}
          MAX_PAPER_NUM: ${{ vars.MAX_PAPER_NUM }}
          MODEL_NAME: ${{ env.OLLAMA_MODEL }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run main.py
